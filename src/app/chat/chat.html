<div class="app-content-header">
  <div class="container-fluid">
    <h3 class="mb-0">Chat</h3>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#">Home</a></li>
      <li class="breadcrumb-item active">Chat</li>
    </ol>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div class="d-flex align-items-center mb-3">
      <span class="rounded-circle bg-secondary-subtle d-inline-flex justify-content-center align-items-center me-2" style="width:40px;height:40px">OB</span>
      <div class="flex-grow-1">
        <strong>Olivia Bennett</strong><br>
        <small class="text-success">● Online · typing…</small>
      </div>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-secondary"><i class="bi bi-telephone"></i></button>
        <button class="btn btn-outline-secondary"><i class="bi bi-camera-video"></i></button>
        <button class="btn btn-outline-secondary"><i class="bi bi-three-dots-vertical"></i></button>
      </div>
    </div>

    @for (m of messages; track $index) {
      <div class="d-flex mb-3" [class.justify-content-end]="m.mine">
        <div style="max-width:80%">
          <div class="p-2 rounded-3" [class.bg-secondary]="m.mine" [class.text-white]="m.mine">
            {{ m.text }}
          </div>
          <small class="text-muted">{{ m.time }}</small>
        </div>
      </div>
    }

    <div class="input-group mt-3">
      <button class="btn btn-outline-secondary"><i class="bi bi-paperclip"></i></button>
      <input class="form-control" placeholder="Type a message…" [(ngModel)]="newMessage" (keyup.enter)="send()">
      <button class="btn btn-outline-secondary"><i class="bi bi-emoji-smile"></i></button>
      <button class="btn btn-secondary" (click)="send()"><i class="bi bi-send"></i></button>
    </div>
  </div>
</div>
